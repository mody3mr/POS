<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير المطعم</title>
    
    <!-- ربط ملف تعريف البرنامج -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* تصميم مبدئي سريع للشاشة */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f4f9; display: flex; height: 100vh; }
        .menu-section { flex: 3; padding: 20px; }
        .cart-section { flex: 1; background-color: #fff; border-right: 2px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        .header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; width: 100%; position: absolute; top: 0; }
        .content { margin-top: 60px; display: flex; width: 100%; }
        .btn-install { background-color: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>نظام المبيعات - وضع الكاشير</h2>
        <!-- الزرار ده هيظهر بس لو السيستم جاهز للتثبيت كبرنامج -->
        <button id="installBtn" class="btn-install">تثبيت البرنامج على الجهاز</button>
    </div>

    <div class="content">
        <!-- قسم قائمة الطعام -->
        <div class="menu-section">
            <h3>قائمة الأصناف</h3>
            <p>هنا هتظهر زراير الأصناف بعد ما نربطها بقاعدة البيانات...</p>
        </div>

        <!-- قسم الفاتورة الحالية -->
        <div class="cart-section">
            <h3>الفاتورة الحالية</h3>
            <hr>
            <div id="cartItems">
                <p style="color: gray;">الفاتورة فارغة حالياً</p>
            </div>
            <hr>
            <h3 style="text-align: left;">الإجمالي: 0 ج.م</h3>
            <button style="background-color: #2980b9; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer;">تأكيد وطباعة الفاتورة</button>
        </div>
    </div>

    <script>
        // كود مبدئي لتفعيل التثبيت كبرنامج (PWA)
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
    
    <!-- ربط ملف التشغيل الأساسي -->
    <script src="app.js"></script>
</body>
</html>
