<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاشير المطعم</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f4f9; display: flex; height: 100vh; overflow: hidden; }
        .header { background-color: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; width: 100%; box-sizing: border-box; height: 60px; z-index: 10; }
        .btn-install { background-color: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; display: none; }
        .content { margin-top: 60px; display: flex; width: 100%; height: calc(100vh - 60px); }
        
        /* قسم المنيو */
        .menu-section { flex: 3; padding: 20px; overflow-y: auto; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .menu-item { background: white; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.2s; border: 2px solid transparent; }
        .menu-item:hover { border-color: #3498db; transform: translateY(-2px); }
        .menu-item h4 { margin: 10px 0 5px; color: #333; }
        .menu-item p { margin: 0; color: #27ae60; font-weight: bold; }

        /* قسم الفاتورة */
        .cart-section { flex: 1.2; background-color: #fff; border-right: 2px solid #ddd; padding: 20px; display: flex; flex-direction: column; box-shadow: -2px 0 5px rgba(0,0,0,0.05); }
        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; border-bottom: 2px dashed #eee; padding-bottom: 10px; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .cart-row:last-child { border-bottom: none; }
        .cart-row button { background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 3px 8px; }
        .total-section { text-align: left; margin-bottom: 15px; }
        .btn-checkout { background-color: #2980b9; color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-checkout:hover { background-color: #2471a3; }
    </style>
</head>
<body>

    <div class="header">
        <h2>الكاشير</h2>
        <button id="installBtn" class="btn-install">تثبيت البرنامج</button>
    </div>

    <div class="content">
        <!-- قسم قائمة الطعام -->
        <div class="menu-section">
            <div class="menu-grid" id="menuGrid">
                <!-- الأصناف هتترسم هنا عن طريق الجافاسكريبت -->
            </div>
        </div>

        <!-- قسم الفاتورة الحالية -->
        <div class="cart-section">
            <h3 style="margin-top:0;">الفاتورة الحالية</h3>
            <div class="cart-items" id="cartItems">
                <p style="color: gray; text-align: center; margin-top: 50px;">لم يتم إضافة أصناف</p>
            </div>
            <div class="total-section">
                <h2 style="margin: 0; color: #2c3e50;">الإجمالي: <span id="totalPrice">0</span> ج.م</h2>
            </div>
            <button class="btn-checkout" onclick="printInvoice()">تأكيد وطباعة الفاتورة</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
